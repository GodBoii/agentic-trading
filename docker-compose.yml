x-service: &service
  build:
    context: .
    dockerfile: python-backend/Dockerfile
  env_file:
    - .env
    - python-backend/.env
  working_dir: /app/python-backend
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-common-volumes: &common-volumes
  - ./python-backend:/app/python-backend
  - ./:/app

services:
  dhan-auth-manager:
    <<: *service
    command: python -m pipeline.runtime.run_dhan_auth_manager
    environment:
      DHAN_AUTH_HEALTH_PORT: "8030"
      DHAN_AUTO_RENEW_BEFORE_MINUTES: "240"
      DHAN_AUTO_RENEW_CHECK_SECONDS: "900"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8030/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes: *common-volumes

  market-data-gateway:
    <<: *service
    command: python -m pipeline.runtime.run_market_data_gateway
    depends_on:
      dhan-auth-manager:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes: *common-volumes

  universe-scanner:
    <<: *service
    command: python -m pipeline.runtime.run_universe_scanner
    environment:
      MARKET_DATA_GATEWAY_URL: http://market-data-gateway:8010
      UNIVERSE_SCANNER_BUILD_INTRADAY_BASELINES: "1"
    depends_on:
      dhan-auth-manager:
        condition: service_healthy
      market-data-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,os,sys; from pathlib import Path; os.environ['MARKET_CALENDAR_NSE_SYNC_ENABLED']='0'; from pipeline.config import PipelineConfig; from pipeline.services.market_calendar_service import MarketCalendarService; session=MarketCalendarService(PipelineConfig()).session_status(); p=Path('/app/python-backend/results/stage1/latest.json'); d=json.loads(p.read_text()) if p.exists() else {}; s=d.get('summary',{}); artifact_ok=s.get('status')=='completed' and s.get('market_date')==session.market_date and int(s.get('baseline_schema_version') or 0)>=2; sys.exit(0 if (not session.is_trading_day or session.is_before_open or artifact_ok) else 1)"
      interval: 30s
      timeout: 5s
      retries: 120
      start_period: 30s
    volumes: *common-volumes

  intra-finder:
    <<: *service
    command: python -m pipeline.runtime.run_intra_finder
    environment:
      AI_TRADING_EVENT_URL: http://ai-trading-agents:8020/ai-trading/event
      MARKET_DATA_GATEWAY_URL: http://market-data-gateway:8010
      INTRA_FINDER_HEALTH_PORT: "8040"
      INTRA_FINDER_SHADOW_MODE: "${INTRA_FINDER_SHADOW_MODE:-1}"
      INTRA_FINDER_PROGRESS_LOG_SECONDS: "60"
      INTRA_FINDER_INDICATOR_AGGREGATION_SECONDS: "${INTRA_FINDER_INDICATOR_AGGREGATION_SECONDS:-60}"
      INTRA_FINDER_INDICATOR_EVENT_COOLDOWN_SECONDS: "${INTRA_FINDER_INDICATOR_EVENT_COOLDOWN_SECONDS:-600}"
      INTRA_FINDER_STOCK_AGENT_COOLDOWN_SECONDS: "${INTRA_FINDER_STOCK_AGENT_COOLDOWN_SECONDS:-1200}"
      INTRA_FINDER_INDICATOR_VOLUME_SURGE_RATIO: "${INTRA_FINDER_INDICATOR_VOLUME_SURGE_RATIO:-1.8}"
      INTRA_FINDER_INDICATOR_MAX_EVENT_LAG_SECONDS: "${INTRA_FINDER_INDICATOR_MAX_EVENT_LAG_SECONDS:-60}"
    depends_on:
      dhan-auth-manager:
        condition: service_healthy
      market-data-gateway:
        condition: service_healthy
      universe-scanner:
        # Intra-Finder has its own safe WAITING_FOR_UNIVERSE loop and validates
        # that the snapshot is completed and belongs to the current market day.
        # Starting the process here avoids leaving the container in Created
        # state for the duration of the (potentially long) daily universe scan.
        condition: service_started
      ai-trading-agents:
        condition: service_healthy
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client,sys; c=http.client.HTTPConnection('localhost',8040,timeout=3); c.request('GET','/live'); r=c.getresponse(); r.read(); c.close(); sys.exit(0 if r.status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    volumes: *common-volumes

  nifty-50-market-depth:
    <<: *service
    command: python -m pipeline.runtime.run_nifty_50_market_depth
    environment:
      MARKET_DATA_GATEWAY_URL: http://market-data-gateway:8010
      # The research recorder stays parked until an F&O strategy consumes it.
      # Set NIFTY_DEPTH_MONITOR_ENABLED=1 in .env and recreate this service to
      # enable collection again.
      NIFTY_DEPTH_MONITOR_ENABLED: "${NIFTY_DEPTH_MONITOR_ENABLED:-0}"
      NIFTY_DEPTH_PERSIST_EVERY_PACKET: "1"
      NIFTY_DEPTH_RAW_WRITE_SECONDS: "0"
      NIFTY_DEPTH_PROGRESS_LOG_SECONDS: "60"
    depends_on:
      dhan-auth-manager:
        condition: service_healthy
      market-data-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys; enabled=os.getenv('NIFTY_DEPTH_MONITOR_ENABLED','1').strip().lower() in {'1','true','yes','y','on'}; sys.exit(0) if not enabled else None; import json; from datetime import datetime; from pathlib import Path; os.environ['MARKET_CALENDAR_NSE_SYNC_ENABLED']='0'; from pipeline.config import PipelineConfig; from pipeline.services.market_calendar_service import MarketCalendarService; s=MarketCalendarService(PipelineConfig()).session_status(); p=Path('/app/python-backend/results/nifty-50-market-depth/latest.json'); d=json.loads(p.read_text()) if p.exists() else {}; t=d.get('generated_at_utc') or d.get('updated_at_utc'); age=(datetime.now(datetime.fromisoformat(t).tzinfo)-datetime.fromisoformat(t)).total_seconds() if t else 10**9; sys.exit(0 if (not s.is_trading_day or s.is_after_close or age <= 120) else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 45s
    volumes: *common-volumes

  ai-trading-agents:
    <<: *service
    container_name: trader-ai-trading-agents
    command: python -m pipeline.runtime.run_ai_trading_orchestrator
    environment:
      MARKET_DATA_GATEWAY_URL: http://market-data-gateway:8010
      STOCK_AGENT_DEBUG: "1"
    depends_on:
      dhan-auth-manager:
        condition: service_healthy
      market-data-gateway:
        condition: service_healthy
    expose:
      - "8020"
    ports:
      - "127.0.0.1:8020:8020"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8020/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes: *common-volumes

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: trader-cloudflared
    command: tunnel --no-autoupdate --loglevel info run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      ai-trading-agents:
        condition: service_healthy
    restart: unless-stopped
