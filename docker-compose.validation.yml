name: trader-latency-check

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 96mb --maxmemory-policy noeviction
    mem_limit: 128m
    networks: [validation]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 1s
      retries: 10

  tests:
    build:
      context: .
      dockerfile: python-backend/Dockerfile.validation
    image: trader-latency-validation:local
    environment:
      TRADER_TEST_REDIS_URL: redis://redis:6379/0
    cpus: 2
    mem_limit: 4g
    networks: [validation]
    depends_on:
      redis:
        condition: service_healthy

networks:
  validation:
    internal: true
