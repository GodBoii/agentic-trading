[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-research"
version = "0.1.0"
description = "Offline Nifty futures and options research with chronological evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=16", "scikit-learn>=1.3", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests", "research"]
addopts = "--import-mode=importlib"
norecursedirs = ["artifacts", "source_snapshot", "program_runs", "__pycache__"]

[tool.setuptools.packages.find]
include = ["nifty_lab*"]

